<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090b" />
  <title>b1api — music</title>
  <script>
  (async function () {
    const PARENT = "34aa0e328a1681b0d3f17c31b76abdd6f4a5d3be";
    const urls = [
      "https://cdn.jsdelivr.net/gh/b-1-o/music@" + PARENT + "/index.html",
      "https://raw.githubusercontent.com/b-1-o/music/" + PARENT + "/index.html"
    ];
    let html = null;
    for (const url of urls) {
      try {
        const res = await fetch(url, { cache: "no-store" });
        if (res.ok) { html = await res.text(); break; }
      } catch (e) {}
    }
    if (!html) {
      document.documentElement.innerHTML = "<body style=\"background:#09090b;color:#fff;font:14px monospace;padding:24px\">Unable to restore page shell. Please hard-refresh.</body>";
      return;
    }
    if (!html.includes("mobile-fix.css")) {
      html = html.replace(
        '<link rel="stylesheet" href="./styles.css" />',
        '<link rel="stylesheet" href="./styles.css" />\n  <link rel="stylesheet" href="./mobile-fix.css" />'
      );
    }
    document.open();
    document.write(html);
    document.close();
  })();
  </script>
</head>
<body style="background:#09090b;color:#888;font:13px monospace;padding:24px">Loading…</body>
</html>
